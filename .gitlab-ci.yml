stages:
  - 1_linter
  - 2_build_and_install
  - 3_mvn_install
  - 4_sonarqube

before_script:
  - pwd
  - echo $CI_BUILD_REF_NAME
  - git remote -v
  # Credentials for the first-party git dependencies. package.json names them as
  # git+https://git@gitlab.prtech.mk/..., and pnpm hands that URL straight to
  # git, which has no credentials for it and fails with "could not read
  # Username". The runner's own clone is authenticated, but that applies to this
  # repository only, not to the ones pnpm fetches.
  #
  # Rewriting the host mapping rather than the specifier keeps the URL recorded
  # in the lockfile working on every other machine. K8S_SECRET_GITLABCI_TOKEN is
  # the token perun-atlas already uses for pushing; CI_JOB_TOKEN is the fallback
  # and needs the dependency projects to allow job-token access.
  - GIT_DEP_TOKEN="${K8S_SECRET_GITLABCI_TOKEN:-$CI_JOB_TOKEN}"
  # Clear our own rules before adding them. ~/.gitconfig survives between jobs
  # and --add appends, so these accumulated a pair per pipeline -- and since
  # CI_JOB_TOKEN is issued per job, the older entries carry tokens that have
  # since expired. Several rules match the same URL and git picks one of them,
  # so leaving the stale ones in place makes the result depend on which.
  - git config --global --get-regexp '^url\..*\.insteadof$' | cut -d' ' -f1 | sort -u | while read -r k; do git config --global --unset-all "$k" || true; done
  # http, not https: the scheme the runner itself is authenticated over. Its own
  # origin is http://gitlab-ci-token:<token>@gitlab.prtech.mk/..., so that is the
  # combination this server is known to accept.
  - git config --global --add url."http://gitlab-ci-token:${GIT_DEP_TOKEN}@gitlab.prtech.mk/".insteadOf "https://git@gitlab.prtech.mk/"
  - git config --global --add url."http://gitlab-ci-token:${GIT_DEP_TOKEN}@gitlab.prtech.mk/".insteadOf "https://gitlab.prtech.mk/"
  # Say which credential was used and that the rules registered, so a failure to
  # clone a dependency is diagnosable from the log alone. The value is redacted;
  # only its source and presence are printed.
  - if [ -n "$K8S_SECRET_GITLABCI_TOKEN" ]; then echo "git dep credential - K8S_SECRET_GITLABCI_TOKEN"; elif [ -n "$CI_JOB_TOKEN" ]; then echo "git dep credential - CI_JOB_TOKEN (requires job-token allowlisting in perun-atlas and perun-core)"; else echo "git dep credential - NONE SET, dependency clones will fail"; fi
  - git config --global --get-regexp 'url\..*insteadOf' | sed 's#//[^@]*@#//***@#' || echo "no insteadOf rules registered"
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME
  # The runner's global pnpm predates lockfileVersion 9.0, so it was discarding
  # the lockfile -- "Ignoring not compatible lockfile" -- and resolving #main and
  # #dev afresh on every run. That builds whatever those branches point at rather
  # than the commits this repository pinned, and it is what forces the remote
  # resolution in the first place. With a pnpm that reads the lockfile, the
  # resolution step is skipped entirely.
  #
  # The version comes from packageManager in package.json, so it is reviewed with
  # the code and identical here and on a developer's machine.
  #
  # Installed somewhere writable rather than system-wide: this is a shell runner
  # running as an unprivileged user, so `corepack enable` cannot symlink into
  # /usr/bin and `npm i -g` cannot write /usr/lib/node_modules -- both fail with
  # EACCES. The shim goes in the runner's own home and ahead of the system pnpm
  # on PATH. corepack works out the relative path back to itself, so the depth of
  # this directory does not matter. The fallback covers an image without corepack.
  # Installed into the runner's home, not system-wide: this is a shell runner
  # executing as an unprivileged user, so anything touching /usr/bin or
  # /usr/lib/node_modules fails with EACCES.
  #
  # Deliberately not corepack. The corepack bundled with this runner's Node
  # carries npm's old registry signing keys and dies with "Cannot find matching
  # keyid" before it can hand over to pnpm. It is also unnecessary: pnpm reads
  # packageManager itself and switches to the pinned version, so this install is
  # only a bootstrap and its version does not have to track package.json.
  # The runner's home survives between jobs, so whatever a previous revision of
  # this file put here is still present -- a corepack shim, in this case, which
  # npm will not overwrite ("EEXIST: file already exists") because it did not
  # create it. Clear the two names this bootstrap owns before installing, so the
  # step does not depend on what the last pipeline happened to leave behind.
  - mkdir -p "$HOME/.local/bin"
  - rm -f "$HOME/.local/bin/pnpm" "$HOME/.local/bin/pnpx"
  - npm config set prefix "$HOME/.local"
  - npm install -g pnpm@10.15.0
  - export PATH="$HOME/.local/bin:$PATH"
  - pnpm --version

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

1_npm_install_test_build:
  stage: 1_linter
  script:
    - pwd
    - git reset --hard HEAD
    # The floor is stated once, in package.json's `engines`, and read back here
    # rather than repeated -- the two cannot drift into disagreeing.
    #
    # It is checked rather than merely declared because declaring it is not
    # enough: pnpm only warns when a regular dependency's engines do not match,
    # and says nothing at all when it skips an *optional* one for the same
    # reason. Vite's bundler and oxlint are each built as one optional native
    # binding per platform, so a runner below the floor installs cleanly and then
    # fails with a missing-module trace that names neither node nor the version.
    # This step buys a sentence instead. The runner's node is shared with every
    # other svarog4 project and upgraded by hand.
    - |
      floor=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
      have=$(node -p "process.versions.node")
      if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" != "$floor" ]; then
        echo "This runner has node $have; this package needs $floor or newer."
        echo "vite and oxlint declare it, and their native bindings are optional"
        echo "dependencies -- pnpm skips one whose engines do not match without"
        echo "printing anything, so the build would fail a few layers lower down."
        echo "Upgrade node on the runner rather than changing anything here."
        exit 1
      fi
      echo "ok - node $have meets the floor of $floor"
    - rm -rf node_modules
    - pnpm install
    # `test` was `eslint --fix frontend/ || exit 0`: it repaired what it could and
    # could never fail a pipeline. There is no test suite here, so the script is
    # gone and lint runs under its own name, and now fails the pipeline on an
    # error. Warnings do not: the react-hooks/exhaustive-deps ones are effects
    # that run once on purpose, and are left standing rather than silenced.
    - pnpm run lint
    - pnpm run build

1_build_test_java:
  stage: 2_build_and_install
  script:
    - cd backend
    - mvn clean
    - mvn test
    
1_farm-registry-dev-install:
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install
    - rm -rf backend/www/*.js
    - pnpm run build
    - cd backend
    - ls -al www/
    - pwd
    - mvn clean compile deploy -DskipTests
  only:
    - dev    

2_farm-registry-stable-install:
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install
    - rm -rf backend/www/*.js
    - pnpm run build
    - cd backend
    - ls -al www/
    - pwd
    - mvn clean compile deploy -DskipTests
  only:
    - main

1_perun-sonarqube_backend:
  stage: 4_sonarqube
  script:
    - cd $CI_PROJECT_DIR/
    - cd backend
    - mvn sonar:sonar -Dsonar.analysis.mode=preview -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
  when: manual
  
2_perun-sonarqube_backend_publish:
  stage: 4_sonarqube
  script:
    - cd $CI_PROJECT_DIR/
    - cd backend
    - mvn sonar:sonar -Dsonar.analysis.mode=publish -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID -Donar.gitlab.user_token access=a18878c7b5beb401ce2f847537c296b46a3902b8 
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - staging
    - dev  
  when: manual

3_sonarqube_frontend:
  stage: 4_sonarqube
  script:
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=preview -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=publish -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME
  when: manual

